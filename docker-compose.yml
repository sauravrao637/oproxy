services:
  oproxy:
    image: oproxy:latest
    build: .

    # Bridge networking + published ports (the default below) works on every
    # Docker platform, including Docker Desktop for Windows/macOS. `network_mode:
    # host` (commented out further down) sees real client IPs with zero port
    # mapping, but only works on Linux hosts - on Docker Desktop it maps into the
    # Docker Desktop VM, not the actual Windows/macOS host, so the quick-start
    # is unreachable there. Ports below are bound to the host's
    # loopback interface only; reaching the admin UI/API through them relies on
    # OPROXY_ALLOW_REMOTE_ADMIN + OPROXY_ADMIN_TOKEN below - Docker's
    # port-publishing NAT means the proxy never sees a genuinely loopback peer
    # even for host-local traffic, so that opt-in + token combination is what
    # unlocks the UI here instead of the loopback-peer check used on bare metal.
    ports:
      - "127.0.0.1:8080:8080"   # HTTP proxy + admin UI
      # Both mappings below use port 8443, but they are two distinct listeners
      # on two distinct transports, not a conflict: HTTP/3 is UDP-only (QUIC),
      # while OPROXY_HTTPS_PORT is a TCP listener. The TCP mapping is only
      # useful if you uncomment OPROXY_HTTPS_PORT below; HTTP/3 is enabled by
      # default via OPROXY_HTTP3_ENABLED/OPROXY_HTTP3_PORT further down, so the
      # UDP mapping is the one actually in use out of the box.
      - "127.0.0.1:8443:8443"     # OPROXY_HTTPS_PORT (TCP) - unused unless uncommented below
      - "127.0.0.1:8443:8443/udp" # HTTP/3 (QUIC) listener, UDP - active by default
      # - "127.0.0.1:1080:1080" # SOCKS5 listener (uncomment with OPROXY_SOCKS5_PORT below)
    # Uncomment for host networking instead (Linux only - see note above):
    # network_mode: host

    environment:
      # ── Core ─────────────────────────────────────────────────────────────────
      # Port the proxy listens on. (default: 8080)
      OPROXY_PORT: "8080"
      # IP to bind to. "0.0.0.0" accepts all interfaces; "127.0.0.1" localhost-only.
      OPROXY_BIND_HOST: "0.0.0.0"
      # Enable MITM TLS interception. Clients must trust /app/certs/root.crt.
      OPROXY_MITM_ENABLED: "true"
      # Directory where rules, hot config, and saved session snapshots are stored.
      # OPROXY_STORAGE_PATH: "/app/storage"

      # ── Additional listeners ──────────────────────────────────────────────────
      # HTTPS proxy listener: accepts CONNECT and plain requests over TLS on this port.
      # Clients must trust the generated root CA. Disabled when unset.
      # OPROXY_HTTPS_PORT: "8443"
      # upstream_proxy chaining has no env var override; configure it in the
      # YAML config file mounted at /app/configs/default.yaml (see volumes).
      # HTTP/3 (QUIC) listener on a dedicated UDP port. The Docker image is built
      # with --all-features, so the http3 feature is available; both env vars are
      # required for the listener to start. Forwarded responses advertise it via
      # alt-svc. Clients must trust the oproxy root CA for QUIC TLS.
      OPROXY_HTTP3_ENABLED: "true"
      OPROXY_HTTP3_PORT: "8443"
      # SOCKS5 listener port. Overrides `socks5_port` in YAML; set to "0" to
      # disable. Keep aligned with the bridge port mapping above.
      # OPROXY_SOCKS5_PORT: "1080"
      # The setup wizard (/setup, its QR code, /admin/setup/network-info) auto-detects
      # a LAN IP by asking the OS which interface it would use to reach the internet -
      # inside this container that's the Docker bridge address, not anything a phone
      # or browser on your LAN can reach. Set this to your host machine's
      # real LAN IP (e.g. what `ipconfig`/`ifconfig` shows) so the wizard advertises a
      # working address instead. Leave unset if you only access oproxy from this host.
      # OPROXY_ADVERTISED_HOST: "192.168.1.50"

      # ── Admin security ────────────────────────────────────────────────────────
      # Allow the admin UI/API to be reached from non-loopback clients (phones, VMs)
      # AND from Host: 127.0.0.1 requests whose peer isn't verifiably loopback -
      # which, under bridge networking + published ports, includes every request
      # coming through the published port above, even from a browser on the same
      # machine (Docker's port-publishing NAT means the container never sees true
      # loopback for that traffic). Required for the Web UI to be reachable at all
      # with the ports: mapping above; set back to "false" only if you
      # switch to network_mode: host, where the loopback-only default is safe.
      OPROXY_ALLOW_REMOTE_ADMIN: "true"
      # Required once OPROXY_ALLOW_REMOTE_ADMIN is true - CHANGE THIS before
      # exposing the container beyond your own machine. Accepted via the
      # x-oproxy-admin-token header, Authorization: Bearer <token>, the
      # oproxy_admin_token cookie, or a ?token=<token> query param; the Web UI
      # login page also accepts it directly.
      OPROXY_ADMIN_TOKEN: "change-me-to-a-strong-secret"
      # Allow admin-initiated requests (/admin/forward, webhooks, replay) to reach
      # private/local IPs. Disabled by default to reduce SSRF exposure.
      # OPROXY_ALLOW_PRIVATE_ADMIN_EGRESS: "false"

      # ── Capture limits ────────────────────────────────────────────────────────
      # Max body buffered per exchange in memory, bytes. (default: 10485760 = 10 MB)
      # OPROXY_MAX_BODY_BYTES: "10485760"
      # Session ring-buffer size; oldest entry evicted when full. (default: 10000)
      # OPROXY_MAX_SESSIONS: "10000"
      # Total body bytes kept across all sessions; old bodies are dropped when this
      # budget is exceeded but session metadata is kept. (default: 67108864 = 64 MB)
      # OPROXY_MAX_RETAINED_BODY_BYTES: "67108864"
      # Max concurrent downstream connections across all listeners. (default: 1024)
      # OPROXY_MAX_CONNECTIONS: "1024"
      # Parse and record individual WebSocket frames. (default: true)
      # OPROXY_INSPECT_WS_FRAMES: "true"

      # ── Timeouts ──────────────────────────────────────────────────────────────
      # TCP connect timeout for upstream dials, seconds. (default: 10)
      # OPROXY_CONNECT_TIMEOUT_SECS: "10"
      # SOCKS5/TLS handshake phase timeout, seconds. (default: 10)
      # OPROXY_HANDSHAKE_TIMEOUT_SECS: "10"
      # Graceful shutdown: time to drain active connections, seconds. (default: 10)
      # OPROXY_SHUTDOWN_GRACE_SECS: "10"
      # Per-request upstream read timeout has no env var; set timeout_secs in YAML.

      # ── Logging ───────────────────────────────────────────────────────────────
      # Log level: trace | debug | info | warn | error. (default: info)
      # OPROXY_LOG_LEVEL: "info"
      # Directory for rolling log files. (default: current working directory)
      # OPROXY_LOG_DIR: "/var/log/oproxy"
      # Fine-grained tracing filter; overrides OPROXY_LOG_LEVEL when set.
      # Syntax: https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html
      # RUST_LOG: "oproxy=debug,tower_http=info"

      # ── Map Local ─────────────────────────────────────────────────────────────
      # Base directory for Map Local fixture files inside the container.
      # Relative paths in rules resolve from here; absolute paths still work.
      # Keep this in sync with the container path of the mock-responses volume.
      OPROXY_MAP_LOCAL_BASE_PATH: "/map-local"

      # ── TLS verification ──────────────────────────────────────────────────────
      # Skip TLS certificate verification for upstream connections. Off by
      # default - uncomment only when you specifically need it, e.g. targeting
      # a dev/staging upstream with a self-signed or private-CA cert that
      # reqwest's certificate store doesn't trust. Ordinary HTTPS upstreams
      # (anything with a publicly-trusted cert) work fine through MITM without
      # this - it is not required for MITM interception in general.
      # WARNING: disables ALL upstream cert validation for every request this
      # proxy makes, not just the one upstream you're debugging. Do not leave
      # this on for routine use or anything resembling production.
      # OPROXY_INSECURE_UPSTREAM: 1

    volumes:
      # ── Persistent data ───────────────────────────────────────────────────────
      # Root CA key + cert. Trust root.crt once; it never rotates between restarts.
      - oproxy-certs:/app/certs
      # Rules, hot config, and manually saved session snapshots.
      - oproxy-storage:/app/storage

      # ── Map Local fixtures ────────────────────────────────────────────────────
      # Host directory of static mock response files served by Map Local rules.
      # Create rules with relative paths (e.g. "api/users.json"); they resolve to
      # /map-local/api/users.json inside the container. Paste content directly in
      # the UI to skip the volume mount for one-off fixtures.
      - ./mock-responses:/map-local
      # ── YAML config (optional) ────────────────────────────────────────────────
      # Mount a YAML config file to set options that have no env var override:
      #   upstream_proxy, timeout_secs, pool_max_idle_per_host,
      #   pool_idle_timeout_secs, log.file
      # (socks5_port does have an override: OPROXY_SOCKS5_PORT, see above.)
      # OPROXY_CONFIG defaults to /app/configs/default.yaml.
      # - ./configs/default.yaml:/app/configs/default.yaml:ro

    # Surfaces a crash-looping container (e.g. from a typo'd env var - invalid
    # values are fatal by design, see docs/configuration.md) as "unhealthy" in
    # `docker compose ps`/`docker ps` instead of a silent restart cycle with no
    # obvious signal short of reading logs. /health is served without auth.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    restart: unless-stopped

  # ── Protocol fixtures (optional) ────────────────────────────────────────────
  # Stable local protocol origins for testing oproxy without external services.
  # Started only with the "fixtures" profile:
  #   docker compose --profile fixtures up --build
  # See docs/docker.md § Protocol Fixtures for the port/URL table.
  protocol-fixtures:
    profiles: ["fixtures"]
    build:
      context: .
      dockerfile: tests/fixtures/Dockerfile
    # Publish on host loopback so host-network oproxy, browser tests, and local
    # CLI clients all target the same addresses (see docs/docker.md).
    ports:
      - "127.0.0.1:18080:18080" # HTTP/1.1 origin
      - "127.0.0.1:18443:18443" # HTTP/2 TLS origin
      - "127.0.0.1:18081:18081" # WebSocket echo origin
      - "127.0.0.1:19090:19090" # gRPC TLS echo origin
    volumes:
      # Self-signed origin CAs written by the fixture container; trust these when
      # connecting directly to the TLS fixtures (not through oproxy MITM).
      - protocol-fixture-certs:/fixtures/certs
    restart: unless-stopped

volumes:
  oproxy-certs:
  oproxy-storage:
  protocol-fixture-certs:
