[package]
name = "oproxy"
version = "0.1.10"
edition = "2024"
build = "build.rs"
license = "MIT"
description = "Programmable HTTP/HTTPS proxy for inspecting, debugging, and manipulating network traffic"
repository = "https://github.com/sauravrao637/oproxy"

# `xtask` is deliberately not a default member, so plain `cargo build` /
# `cargo test` here don't build it — only `cargo xtask ...` or
# `--workspace` do.
[workspace]
members = ["xtask"]

# Lint policy lives here so every contributor gets the same bar locally, not
# only in CI. `unsafe_code = "warn"` forces a documented `#[allow(unsafe_code)]`
# (with a SAFETY note) at each genuine unsafe site.
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[[bin]]
name = "oproxy"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = []
# HTTP/3 (QUIC) support.
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:webpki-roots"]
# OpenTelemetry export of per-exchange protocol spans. Gates the
# per-exchange emission; the OTLP exporter layer (opentelemetry-otlp /
# tracing-opentelemetry) is attached at the logging layer when enabled.
otel = []

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2"] }
rcgen = "0.14.10"
rustls = "0.23.44"
tokio-rustls = "0.26.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34+deprecated"
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
regex = "1.13.1"
# QR for the Root CA install flow. default-features off drops the heavy `image`
# (PNG) backend; we only render SVG strings.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
flate2 = "1.1.10"
brotli = "9.0.0"
zstd = "0.14.0"
bytes = "1.12.1"
indexmap = { version = "2.14.2", features = ["serde"] }
hyper = { version = "1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "http1", "http2", "server"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tokio-stream = { version = "0.1.19", features = ["sync"] }
thiserror = "2.0.20"
futures-util = "0.3.34"
base64 = "0.23.1"
similar = "3.2.0"
graphql-parser = "0.4.1"
prost = "0.14.4"
http-body-util = "0.1.5"
mlua = { version = "0.12.1", features = ["lua54", "vendored", "async", "send"] }
hmac = "0.13"
sha2 = "0.11"
time = "0.3.55"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
quinn        = { version = "0.11.11", optional = true }
h3           = { version = "0.0.8", optional = true }
h3-quinn     = { version = "0.0.10", optional = true }
webpki-roots = { version = "1.0.9", optional = true }
h2 = {version = "0.4.19"}

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test.package."*"]
debug = false
